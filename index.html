<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style/style.css">
    <script src="./script/script.js" defer></script>
</head>
<body>
    <div class="calculatorBody">
        <div class="screenDiv">
            <p class="screen">123</p>
        </div>
        <div class="keyboardDiv">
            <div class="firstRow">
                <button class="clear" type="button" value="clear">C</button>
                <button class="remove" type="button" value="remove">x</button>
                <button class="percentage" type="button" value="percentage">%</button>
                <button class="divide" type="button" value="divide">&divide;</button>
            </div>
            <div class="secondRow">
                <button class="seven" type="button" value="7">7</button>
                <button class="eight" type="button" value="8">8</button>
                <button class="nine" type="button" value="9">9</button>
                <button class="multiply" type="button" value="multiply">X</button>
            </div>
            <div class="thirdRow">
                 <button class="four" type="button" value="4">4</button>
                <button class="five" type="button" value="5">5</button>
                <button class="six" type="button" value="6">6</button>
                <button class="subtraction" type="button" value="subtraction">-</button>               
            </div>
            <div class="fourthRow">
                <button class="one" type="button" value="1">1</button>
                <button class="two" type="button" value="2">2</button>
                <button class="three" type="button" value="3">3</button>
                <button class="addition" type="button" value="addition">+</button>           
            </div>
            <div class="fifthRow">
                <button class="zero" type="button" value="0">0</button>
                <button class="float" type="button" value="float">.</button>
                <button class="equal" type="button" value="equal">=</button>          
            </div>
        </div>
    </div>
</body>
</html>
